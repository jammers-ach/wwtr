         x="-188.98145"
         y="0"><tspan
           x="101.17773"
           y="104.90042"
           id="tspan4425"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4419">There are two types of cards: *</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4421">Who</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4423">* </tspan></tspan><tspan
           x="101.17773"
           y="115.34709"
           id="tspan4433"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4427">cards and *</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4429">Rather</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4431">* cards. Each player is </tspan></tspan><tspan
           x="101.17773"
           y="125.79376"
           id="tspan4441"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4435">dealt *</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4437">5 Who cards</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4439">*. The remaining Who </tspan></tspan><tspan
           x="101.17773"
           y="136.24043"
           id="tspan4445"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4443">cards are placed face down in a draw pile.
</tspan></tspan><tspan
           x="101.17773"
           y="146.27043"
           id="tspan4449"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4447">
</tspan></tspan><tspan
           x="101.17773"
           y="156.30043"
           id="tspan4453"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4451">The Rather cards are also placed face </tspan></tspan><tspan
           x="101.17773"
           y="166.33042"
           id="tspan4457"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4455">down in their own pile.
</tspan></tspan><tspan
           x="101.17773"
           y="176.36042"
           id="tspan4461"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4459">
</tspan></tspan><tspan
           x="101.17773"
           y="186.39042"
           id="tspan4467"><tspan
             style="font-weight:bold;text-anchor:middle;fill:#1a1a1a;stroke:none"
             id="tspan4463">Gameplay</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4465">
</tspan></tspan><tspan
           x="101.17773"
           y="196.83709"
           id="tspan4471"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4469">
</tspan></tspan><tspan
           x="101.17773"
           y="206.86709"
           id="tspan4475"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4473">One player becomes the judge for the </tspan></tspan><tspan
           x="101.17773"
           y="216.89709"
           id="tspan4479"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4477">round (for example, Alice). Alice draws a </tspan></tspan><tspan
           x="101.17773"
           y="227.34376"
           id="tspan4487"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4481">*</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4483">Rather</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4485">* card and reads it out loud, for </tspan></tspan><tspan
           x="101.17773"
           y="237.79043"
           id="tspan4491"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4489">example:
</tspan></tspan><tspan
           x="101.17773"
           y="247.82043"
           id="tspan4495"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4493">
</tspan></tspan><tspan
           x="101.17773"
           y="257.85043"
           id="tspan4499"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4497">&quot;Who would I rather go to for tax advice?&quot;
</tspan></tspan><tspan
           x="101.17773"
           y="267.88043"
           id="tspan4503"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4501">
</tspan></tspan><tspan
           x="101.17773"
           y="277.91043"
           id="tspan4507"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4505">Each other player looks at their Who </tspan></tspan><tspan
           x="101.17773"
           y="287.94043"
           id="tspan4511"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4509">cards and chooses the one they think </tspan></tspan><tspan
           x="101.17773"
           y="297.97042"
           id="tspan4515"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4513">Alice would pick.
</tspan></tspan><tspan
           x="101.17773"
           y="308.00042"
           id="tspan4519"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4517">
</tspan></tspan><tspan
           x="101.17773"
           y="318.03042"
           id="tspan4525"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4521">They place their chosen Who card *f</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4523">ace </tspan></tspan><tspan
           x="101.17773"
           y="328.47708"
           id="tspan4531"><tspan
