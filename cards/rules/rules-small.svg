             id="tspan4527">down</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4529">* in the center of the table.
</tspan></tspan><tspan
           x="101.17773"
           y="338.92373"
           id="tspan4535"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4533">
</tspan></tspan><tspan
           x="101.17773"
           y="348.95373"
           id="tspan4539"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4537">Once everyone has played a card, Alice </tspan></tspan><tspan
           x="101.17773"
           y="358.98373"
           id="tspan4545"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4541">shuffles the submitted cards *</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4543">without </tspan></tspan><tspan
           x="101.17773"
           y="369.43039"
           id="tspan4551"><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4547">looking at them</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4549">*, then lays them out in </tspan></tspan><tspan
           x="101.17773"
           y="379.87704"
           id="tspan4555"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4553">front of her. No one reveals which card </tspan></tspan><tspan
           x="101.17773"
           y="389.90704"
           id="tspan4559"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4557">they submitted.
</tspan></tspan><tspan
           x="101.17773"
           y="399.93704"
           id="tspan4563"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4561">
</tspan></tspan><tspan
           x="101.17773"
           y="409.96704"
           id="tspan4567"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4565">Alice then chooses the card that best </tspan></tspan><tspan
           x="101.17773"
           y="419.99704"
           id="tspan4571"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4569">answers the question (the one she would </tspan></tspan><tspan
           x="101.17773"
           y="430.02703"
           id="tspan4579"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4573">*</tspan><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4575">rather</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4577">* pick). The player who submitted </tspan></tspan><tspan
           x="101.17773"
           y="440.47369"
           id="tspan4583"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4581">that card reveals themselves and wins </tspan></tspan><tspan
           x="101.17773"
           y="450.50369"
           id="tspan4587"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4585">the round, keeping the Rather card as a </tspan></tspan><tspan
           x="101.17773"
           y="460.53369"
           id="tspan4591"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4589">point.
</tspan></tspan><tspan
           x="101.17773"
           y="470.56369"
           id="tspan4595"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4593">
</tspan></tspan><tspan
           x="101.17773"
           y="480.59368"
           id="tspan4601"><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4597">Next round</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4599">
</tspan></tspan><tspan
           x="101.17773"
           y="491.04034"
           id="tspan4605"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4603">
</tspan></tspan><tspan
           x="101.17773"
           y="501.07034"
           id="tspan4609"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4607">The next player becomes the judge, </tspan></tspan><tspan
           x="101.17773"
           y="511.10034"
           id="tspan4613"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4611">draws a new Rather card, and everyone </tspan></tspan><tspan
           x="101.17773"
           y="521.13034"
           id="tspan4617"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4615">else draws a new Who card so they are </tspan></tspan><tspan
           x="101.17773"
           y="531.16037"
           id="tspan4621"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4619">back up to 5 cards.
</tspan></tspan><tspan
           x="101.17773"
           y="541.19039"
           id="tspan4625"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4623">
</tspan></tspan><tspan
           x="101.17773"
           y="551.22042"
           id="tspan4631"><tspan
             style="font-weight:bold;text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4627">Winner</tspan><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4629">
</tspan></tspan><tspan
           x="101.17773"
           y="561.66708"
           id="tspan4635"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4633">
</tspan></tspan><tspan
           x="101.17773"
           y="571.69711"
           id="tspan4639"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4637">Once all the who cards are delt (or when </tspan></tspan><tspan
           x="101.17773"
           y="581.72714"
           id="tspan4643"><tspan
             style="text-align:start;fill:#1a1a1a;stroke:none"
             id="tspan4641">you have had enough) the person with the </tspan></tspan><tspan
