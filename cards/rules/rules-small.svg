         x="-93.589844"
         y="0"><tspan
           x="101.17773"
           y="105.34588"
           id="tspan3310"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3304">There are two types of cards: *</tspan><tspan
             style="font-weight:bold"
             id="tspan3306">Who</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3308">* </tspan></tspan><tspan
           x="101.17773"
           y="116.48903"
           id="tspan3318"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3312">cards and *</tspan><tspan
             style="font-weight:bold"
             id="tspan3314">Rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3316">* cards. Each player is </tspan></tspan><tspan
           x="101.17773"
           y="127.63217"
           id="tspan3326"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3320">dealt *</tspan><tspan
             style="font-weight:bold"
             id="tspan3322">5 Who cards</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3324">*. The remaining Who </tspan></tspan><tspan
           x="101.17773"
           y="138.77531"
           id="tspan3330"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3328">cards are placed face down in a draw </tspan></tspan><tspan
           x="101.17773"
           y="149.47401"
           id="tspan3334"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3332">pile.
</tspan></tspan><tspan
           x="101.17773"
           y="160.17271"
           id="tspan3338"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3336">
</tspan></tspan><tspan
           x="101.17773"
           y="170.87141"
           id="tspan3342"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3340">The Rather cards are also placed face </tspan></tspan><tspan
           x="101.17773"
           y="181.57011"
           id="tspan3346"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3344">down in their own pile.
</tspan></tspan><tspan
           x="101.17773"
           y="192.26881"
           id="tspan3350"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3348">
</tspan></tspan><tspan
           x="101.17773"
           y="202.96751"
           id="tspan3356"><tspan
             style="font-weight:bold"
             id="tspan3352">Gameplay</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3354">
</tspan></tspan><tspan
           x="101.17773"
           y="214.11065"
           id="tspan3360"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3358">
</tspan></tspan><tspan
           x="101.17773"
           y="224.80935"
           id="tspan3364"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3362">One player becomes the judge for the </tspan></tspan><tspan
           x="101.17773"
           y="235.50805"
           id="tspan3368"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3366">round (for example, Alice). Alice draws a </tspan></tspan><tspan
           x="101.17773"
           y="246.20675"
           id="tspan3376"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3370">*</tspan><tspan
             style="font-weight:bold"
             id="tspan3372">Rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3374">* card and reads it out loud, for </tspan></tspan><tspan
           x="101.17773"
           y="257.3499"
           id="tspan3380"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3378">example:
</tspan></tspan><tspan
           x="101.17773"
           y="268.04861"
           id="tspan3384"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3382">
</tspan></tspan><tspan
           x="101.17773"
           y="278.74731"
           id="tspan3388"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3386">&quot;Who would I rather go to for tax advice?&quot;
</tspan></tspan><tspan
           x="101.17773"
           y="289.44601"
           id="tspan3392"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3390">
</tspan></tspan><tspan
           x="101.17773"
           y="300.14471"
           id="tspan3396"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3394">Each other player looks at their Who </tspan></tspan><tspan
           x="101.17773"
           y="310.84341"
           id="tspan3400"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3398">cards and chooses the one they think </tspan></tspan><tspan
           x="101.17773"
           y="321.54211"
           id="tspan3404"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3402">Alice would pick.
</tspan></tspan><tspan
           x="101.17773"
           y="332.24081"
           id="tspan3408"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3406">
</tspan></tspan><tspan
           x="101.17773"
           y="342.93951"
           id="tspan3414"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3410">They place their chosen Who card *f</tspan><tspan
             style="font-weight:bold"
             id="tspan3412">ace </tspan></tspan><tspan
           x="101.17773"
           y="354.08267"
           id="tspan3420"><tspan
             style="font-weight:bold"
             id="tspan3416">down</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3418">* in the center of the table.
</tspan></tspan><tspan
           x="101.17773"
           y="365.22583"
           id="tspan3424"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3422">
</tspan></tspan><tspan
           x="101.17773"
           y="375.92453"
           id="tspan3428"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3426">Once everyone has played a card, Alice </tspan></tspan><tspan
           x="101.17773"
           y="386.62323"
           id="tspan3434"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3430">shuffles the submitted cards *</tspan><tspan
             style="font-weight:bold"
             id="tspan3432">without </tspan></tspan><tspan
           x="101.17773"
           y="397.76639"
           id="tspan3440"><tspan
             style="font-weight:bold"
             id="tspan3436">looking at them</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3438">*, then lays them out in </tspan></tspan><tspan
           x="101.17773"
           y="408.90954"
           id="tspan3444"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3442">front of her. No one reveals which card </tspan></tspan><tspan
           x="101.17773"
           y="419.60824"
           id="tspan3448"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3446">they submitted.
</tspan></tspan><tspan
           x="101.17773"
           y="430.30694"
           id="tspan3452"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3450">
</tspan></tspan><tspan
           x="101.17773"
           y="441.00564"
           id="tspan3456"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3454">Alice then chooses the card that best </tspan></tspan><tspan
           x="101.17773"
           y="451.70434"
           id="tspan3460"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3458">answers the question (the one she would </tspan></tspan><tspan
           x="101.17773"
           y="462.40304"
           id="tspan3468"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3462">*</tspan><tspan
             style="font-weight:bold"
             id="tspan3464">rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3466">* pick). The player who submitted </tspan></tspan><tspan
           x="101.17773"
           y="473.5462"
           id="tspan3472"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3470">that card reveals themselves and wins </tspan></tspan><tspan
           x="101.17773"
           y="484.2449"
           id="tspan3476"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3474">the round, keeping the Rather card as a </tspan></tspan><tspan
           x="101.17773"
           y="494.9436"
           id="tspan3480"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3478">point.
</tspan></tspan><tspan
           x="101.17773"
           y="505.6423"
           id="tspan3484"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3482">
</tspan></tspan><tspan
           x="101.17773"
           y="516.341"
           id="tspan3490"><tspan
             style="font-weight:bold"
             id="tspan3486">Next round</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3488">
</tspan></tspan><tspan
           x="101.17773"
           y="527.48413"
           id="tspan3494"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3492">
</tspan></tspan><tspan
           x="101.17773"
           y="538.18286"
           id="tspan3498"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3496">The next player becomes the judge, </tspan></tspan><tspan
           x="101.17773"
           y="548.88159"
           id="tspan3502"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3500">draws a new Rather card, and everyone </tspan></tspan><tspan
           x="101.17773"
           y="559.58032"
           id="tspan3506"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3504">else draws a new Who card so they are </tspan></tspan><tspan
           x="101.17773"
           y="570.27905"
           id="tspan3510"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3508">back up to 5 cards.
</tspan></tspan><tspan
           x="101.17773"
           y="580.97778"
           id="tspan3514"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3512">
</tspan></tspan><tspan
           x="101.17773"
           y="591.67651"
           id="tspan3520"><tspan
             style="font-weight:bold"
             id="tspan3516">Winner</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3518">
</tspan></tspan><tspan
           x="101.17773"
           y="602.81964"
           id="tspan3524"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3522">
</tspan></tspan><tspan
           x="101.17773"
           y="613.51837"
           id="tspan3528"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3526">Once all the who cards are delt (or when </tspan></tspan><tspan
           x="101.17773"
           y="624.2171"
           id="tspan3532"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3530">you have had enough) the person with </tspan></tspan><tspan
           x="101.17773"
           y="634.91583"
           id="tspan3536"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan3534">the most Rather cards is the winner.
</tspan></tspan></text></g><g
