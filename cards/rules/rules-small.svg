         x="-93.589844"
         y="0"><tspan
           x="101.17773"
           y="104.90042"
           id="tspan4721"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4715">There are two types of cards: *</tspan><tspan
             style="font-weight:bold"
             id="tspan4717">Who</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4719">* </tspan></tspan><tspan
           x="101.17773"
           y="115.34709"
           id="tspan4729"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4723">cards and *</tspan><tspan
             style="font-weight:bold"
             id="tspan4725">Rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4727">* cards. Each player is </tspan></tspan><tspan
           x="101.17773"
           y="125.79376"
           id="tspan4737"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4731">dealt *</tspan><tspan
             style="font-weight:bold"
             id="tspan4733">5 Who cards</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4735">*. The remaining Who </tspan></tspan><tspan
           x="101.17773"
           y="136.24043"
           id="tspan4741"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4739">cards are placed face down in a draw pile.
</tspan></tspan><tspan
           x="101.17773"
           y="146.27043"
           id="tspan4745"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4743">
</tspan></tspan><tspan
           x="101.17773"
           y="156.30043"
           id="tspan4749"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4747">The Rather cards are also placed face </tspan></tspan><tspan
           x="101.17773"
           y="166.33042"
           id="tspan4753"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4751">down in their own pile.
</tspan></tspan><tspan
           x="101.17773"
           y="176.36042"
           id="tspan4757"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4755">
</tspan></tspan><tspan
           x="101.17773"
           y="186.39042"
           id="tspan4763"><tspan
             style="font-weight:bold"
             id="tspan4759">Gameplay</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4761">
</tspan></tspan><tspan
           x="101.17773"
           y="196.83709"
           id="tspan4767"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4765">
</tspan></tspan><tspan
           x="101.17773"
           y="206.86709"
           id="tspan4771"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4769">One player becomes the judge for the </tspan></tspan><tspan
           x="101.17773"
           y="216.89709"
           id="tspan4775"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4773">round (for example, Alice). Alice draws a </tspan></tspan><tspan
           x="101.17773"
           y="227.34376"
           id="tspan4783"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4777">*</tspan><tspan
             style="font-weight:bold"
             id="tspan4779">Rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4781">* card and reads it out loud, for </tspan></tspan><tspan
           x="101.17773"
           y="237.79043"
           id="tspan4787"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4785">example:
</tspan></tspan><tspan
           x="101.17773"
           y="247.82043"
           id="tspan4791"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4789">
</tspan></tspan><tspan
           x="101.17773"
           y="257.85043"
           id="tspan4795"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4793">&quot;Who would I rather go to for tax advice?&quot;
</tspan></tspan><tspan
           x="101.17773"
           y="267.88043"
           id="tspan4799"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4797">
</tspan></tspan><tspan
           x="101.17773"
           y="277.91043"
           id="tspan4803"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4801">Each other player looks at their Who </tspan></tspan><tspan
           x="101.17773"
           y="287.94043"
           id="tspan4807"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4805">cards and chooses the one they think </tspan></tspan><tspan
           x="101.17773"
           y="297.97042"
           id="tspan4811"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4809">Alice would pick.
</tspan></tspan><tspan
           x="101.17773"
           y="308.00042"
           id="tspan4815"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4813">
</tspan></tspan><tspan
           x="101.17773"
           y="318.03042"
           id="tspan4821"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4817">They place their chosen Who card *f</tspan><tspan
             style="font-weight:bold"
             id="tspan4819">ace </tspan></tspan><tspan
           x="101.17773"
           y="328.47708"
           id="tspan4827"><tspan
             style="font-weight:bold"
             id="tspan4823">down</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4825">* in the center of the table.
</tspan></tspan><tspan
           x="101.17773"
           y="338.92373"
           id="tspan4831"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4829">
</tspan></tspan><tspan
           x="101.17773"
           y="348.95373"
           id="tspan4835"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4833">Once everyone has played a card, Alice </tspan></tspan><tspan
           x="101.17773"
           y="358.98373"
           id="tspan4841"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4837">shuffles the submitted cards *</tspan><tspan
             style="font-weight:bold"
             id="tspan4839">without </tspan></tspan><tspan
           x="101.17773"
           y="369.43039"
           id="tspan4847"><tspan
             style="font-weight:bold"
             id="tspan4843">looking at them</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4845">*, then lays them out in </tspan></tspan><tspan
           x="101.17773"
           y="379.87704"
           id="tspan4851"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4849">front of her. No one reveals which card </tspan></tspan><tspan
           x="101.17773"
           y="389.90704"
           id="tspan4855"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4853">they submitted.
</tspan></tspan><tspan
           x="101.17773"
           y="399.93704"
           id="tspan4859"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4857">
</tspan></tspan><tspan
           x="101.17773"
           y="409.96704"
           id="tspan4863"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4861">Alice then chooses the card that best </tspan></tspan><tspan
           x="101.17773"
           y="419.99704"
           id="tspan4867"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4865">answers the question (the one she would </tspan></tspan><tspan
           x="101.17773"
           y="430.02703"
           id="tspan4875"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4869">*</tspan><tspan
             style="font-weight:bold"
             id="tspan4871">rather</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4873">* pick). The player who submitted </tspan></tspan><tspan
           x="101.17773"
           y="440.47369"
           id="tspan4879"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4877">that card reveals themselves and wins </tspan></tspan><tspan
           x="101.17773"
           y="450.50369"
           id="tspan4883"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4881">the round, keeping the Rather card as a </tspan></tspan><tspan
           x="101.17773"
           y="460.53369"
           id="tspan4887"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4885">point.
</tspan></tspan><tspan
           x="101.17773"
           y="470.56369"
           id="tspan4891"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4889">
</tspan></tspan><tspan
           x="101.17773"
           y="480.59368"
           id="tspan4897"><tspan
             style="font-weight:bold"
             id="tspan4893">Next round</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4895">
</tspan></tspan><tspan
           x="101.17773"
           y="491.04034"
           id="tspan4901"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4899">
</tspan></tspan><tspan
           x="101.17773"
           y="501.07034"
           id="tspan4905"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4903">The next player becomes the judge, </tspan></tspan><tspan
           x="101.17773"
           y="511.10034"
           id="tspan4909"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4907">draws a new Rather card, and everyone </tspan></tspan><tspan
           x="101.17773"
           y="521.13034"
           id="tspan4913"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4911">else draws a new Who card so they are </tspan></tspan><tspan
           x="101.17773"
           y="531.16037"
           id="tspan4917"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4915">back up to 5 cards.
</tspan></tspan><tspan
           x="101.17773"
           y="541.19039"
           id="tspan4921"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4919">
</tspan></tspan><tspan
           x="101.17773"
           y="551.22042"
           id="tspan4927"><tspan
             style="font-weight:bold"
             id="tspan4923">Winner</tspan><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4925">
</tspan></tspan><tspan
           x="101.17773"
           y="561.66708"
           id="tspan4931"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4929">
</tspan></tspan><tspan
           x="101.17773"
           y="571.69711"
           id="tspan4935"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4933">Once all the who cards are delt (or when </tspan></tspan><tspan
           x="101.17773"
           y="581.72714"
           id="tspan4939"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4937">you have had enough) the person with the </tspan></tspan><tspan
           x="101.17773"
           y="591.75717"
           id="tspan4943"><tspan
             style="text-align:start;text-anchor:start;fill:#000000;stroke:none"
             id="tspan4941">most Rather cards is the winner.
</tspan></tspan></text></g><g
